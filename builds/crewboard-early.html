<title>Crewboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell with top nav; queue grid, match split view, gantt board with side plan panel */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#1A1D21; --soft:#596068; --faint:#949AA1; --line:#DFE2DC;
  --tape:#2F6BD8; --tape-ink:#FFFFFF; --tape-wash:#E4ECFB;
  --good:#4E8C14; --good-wash:#E6F2D7; --warn:#A86A00; --warn-wash:#FBEFD6; --bad:#BF3B28; --bad-wash:#FAE2DD;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161A; --surface:#1D2025; --sunk:#181A1E; --ink:#ECEDEA; --soft:#A9AEB4; --faint:#747A81; --line:#30343A;
  --tape:#6C9BF0; --tape-ink:#0E1730; --tape-wash:#1F2B45;
  --good:#8CC556; --good-wash:#1F2E16; --warn:#E3A93E; --warn-wash:#34280F; --bad:#EE7B66; --bad-wash:#3A1D18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1D2025; --sunk:#181A1E; --ink:#ECEDEA; --soft:#A9AEB4; --faint:#747A81; --line:#30343A;
  --tape:#6C9BF0; --tape-ink:#0E1730; --tape-wash:#1F2B45;
  --good:#8CC556; --good-wash:#1F2E16; --warn:#E3A93E; --warn-wash:#34280F; --bad:#EE7B66; --bad-wash:#3A1D18; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--tape);display:grid;place-items:center;transform:rotate(-6deg)}
.brand i::after{content:"";width:14px;height:4px;background:var(--tape-ink);border-radius:2px;opacity:.85}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--faint);margin-left:2px}
nav.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--soft);white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav.tabs .ct{background:var(--tape);color:var(--tape-ink);border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.today{margin-left:auto;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:12px}
main{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
.fb{display:none;border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--soft);align-items:center;gap:6px}
.has-comments .fb{display:inline-flex}
.fb:hover{border-color:var(--tape);color:var(--tape)}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--soft)} .tiny{font-size:12px;color:var(--faint)} .small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--soft);white-space:nowrap}
.chip.tape{background:var(--tape-wash);color:var(--tape)}
.chip.good{background:var(--good-wash);color:var(--good)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px}
.btn.tape{background:var(--tape);color:var(--tape-ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h h2{font-size:22px}
/* queue */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--soft)}
.qhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.qhead h1{font-size:30px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.job{overflow:hidden;display:flex;flex-direction:column}
.chipband{display:flex;height:54px}
.chipband div{flex:1;position:relative}
.chipband div span{position:absolute;left:8px;bottom:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.job .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.job h3{font-size:19px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--sunk);border-radius:8px;padding:7px 9px}
.facts b{display:block;font-size:14.5px}
.facts span{font-size:11.5px;color:var(--soft)}
.rec{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* match */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px;margin-bottom:18px}
.mhead h1{font-size:30px}
.back{border:0;background:none;color:var(--tape);font-weight:700;padding:0;margin-bottom:6px}
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.writeup{font-size:13.5px;line-height:1.6;color:var(--soft)}
.writeup mark{background:transparent;color:var(--ink);border-bottom:2px solid var(--tape);padding:0 1px;border-radius:2px;transition:background .15s}
.writeup mark.on{background:var(--tape-wash)}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-bottom:10px}
.reqs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.req{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--sunk);font-size:13.5px}
.req .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.req.must .ic{background:var(--ink);color:var(--bg)}
.req.nice .ic{background:var(--surface);color:var(--soft);border:1px solid var(--line)}
.req small{display:block;color:var(--faint);font-size:11.5px}
.tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.crew{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;margin-bottom:12px}
.crew.top{border:2px solid var(--tape)}
.ring{width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px}
.ring small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;color:var(--faint);font-weight:600}
.members{display:flex;gap:4px;flex-wrap:wrap}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c);position:relative}
.av.cert::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin-top:12px}
.f{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:8px;font-size:12.5px}
.f .bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.f .bar i{display:block;height:100%;background:var(--tape);border-radius:4px}
.f.w0{opacity:.4}
.f .v{text-align:right;color:var(--soft);font-size:12px}
.why{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.why li{display:flex;gap:8px}
.why li::before{content:"+";font-weight:800;color:var(--good)}
.why li.minus::before{content:"\2013";color:var(--warn)}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.out{padding:12px 16px;display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line)}
.out:first-of-type{border-top:0}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rule{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--good-wash);color:var(--good)}
.rule.x{background:var(--bad-wash);color:var(--bad)}
.mapcard svg{width:100%;height:auto;display:block}
.drawer{padding:16px;margin-bottom:14px}
.wrow{display:grid;grid-template-columns:150px 1fr 26px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.wrow input{width:100%;accent-color:var(--tape)}
.tog{width:40px;height:24px;border-radius:12px;border:0;background:var(--line);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--tape)} .tog.on i{left:19px}
.hr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hr:last-child{border-bottom:0}
/* board */
.boardwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;margin-bottom:12px;background:var(--tape-wash);border:1px solid transparent;border-radius:var(--r)}
.gscroll{overflow-x:auto;border-radius:var(--r)}
.gantt{--cw:46px;--lw:170px;min-width:calc(var(--lw) + var(--cw)*20);position:relative;user-select:none}
.grow-h,.grow-r{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw))}
.gh{font-size:11px;text-align:center;padding:6px 0 4px;color:var(--soft);border-left:1px solid var(--line)}
.gh b{display:block;font-size:13px;color:var(--ink)}
.gh.wk{border-left:2px solid var(--faint)}
.gh.today b{color:var(--tape)}
.wx{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw));border-bottom:1px solid var(--line)}
.wx div{display:grid;place-items:center;padding:4px 0;font-size:10.5px;color:var(--soft);border-left:1px solid var(--line)}
.wx div.rain{background:color-mix(in srgb,var(--tape) 10%,transparent)}
.wx svg{width:18px;height:18px}
.lab{padding:10px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;justify-content:center;background:var(--surface);position:sticky;left:0;z-index:3}
.lab b{font-size:13.5px;display:flex;gap:7px;align-items:center}
.lab span{font-size:11.5px;color:var(--soft)}
.crow{position:relative;border-bottom:1px solid var(--line);height:64px}
.crow .cells{position:absolute;inset:0 0 0 var(--lw);display:grid;grid-template-columns:repeat(20,var(--cw))}
.crow .cells div{border-left:1px solid var(--line)}
.crow .cells div.wk{border-left:2px solid var(--line)}
.crow .cells div.rain{background:color-mix(in srgb,var(--tape) 5%,transparent)}
.crow.drop{background:var(--tape-wash)}
.crow.inel .cells{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--bad) 7%,transparent) 8px 10px)}
.bk{position:absolute;top:10px;height:44px;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--ink);z-index:1}
.bk b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{color:var(--soft);white-space:nowrap}
.bk.prop{border-style:dashed}
.ghost{position:absolute;top:8px;height:48px;border:2px dashed var(--tape);border-radius:9px;background:color-mix(in srgb,var(--tape) 8%,transparent);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:700;color:var(--tape);z-index:2}
.ghost:hover{background:color-mix(in srgb,var(--tape) 16%,transparent)}
.nb{position:absolute;top:8px;height:48px;border-radius:9px;background:var(--tape);color:var(--tape-ink);z-index:4;display:flex;overflow:hidden;cursor:grab;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--tape) 70%,transparent);touch-action:none}
.nb.dragging{cursor:grabbing;opacity:.92}
.nb.badpos{background:var(--bad)}
.nb .ph{flex:1;padding:5px 7px;font-size:11px;line-height:1.2;border-right:1px solid color-mix(in srgb,var(--tape-ink) 25%,transparent);overflow:hidden;white-space:nowrap}
.nb .ph:last-child{border-right:0}
.nb .ph b{display:block;font-size:11.5px}
.nb .hold{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--tape-ink) 22%,transparent) 6px 9px)}
.dl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--bad);z-index:5;pointer-events:none}
.dl span{position:absolute;top:2px;left:4px;font-size:10.5px;font-weight:700;color:var(--bad);white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.cap{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw))}
.cap div{height:26px;display:grid;place-items:center;font-size:11px;font-weight:700;border-left:1px solid var(--line)}
.plan{padding:16px;position:sticky;top:76px}
.check{display:flex;gap:8px;font-size:13px;padding:5px 0}
.check i{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;margin-top:1px}
.check.ok i{background:var(--good-wash);color:var(--good)}
.check.wn i{background:var(--warn-wash);color:var(--warn)}
.check.no i{background:var(--bad-wash);color:var(--bad)}
.msgtabs{display:flex;gap:4px;margin:12px 0 8px;flex-wrap:wrap}
.msgtabs button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--soft)}
.msgtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bubble{background:var(--sunk);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13px;white-space:pre-line}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* crews */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ccard{padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.stats b{display:block;font-size:14.5px}
.stats span{font-size:11px;color:var(--soft)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.tdots{display:inline-flex;gap:3px}
.tdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--tape)}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:12px}
.matrix th{font-weight:600;color:var(--soft);padding:2px 4px;white-space:nowrap}
.matrix th.rot{height:70px;vertical-align:bottom}
.matrix th.rot span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg)}
.matrix td{width:34px;height:30px;text-align:center;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
/* ideas */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.idea{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.idea h3{font-size:16px}
.idea p{margin:0;font-size:13.5px;color:var(--soft)}
.icat{margin:26px 0 12px;font-size:20px}
/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:50;display:grid;place-items:center;padding:16px}
.modal{max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
@media (max-width:1080px){.split,.boardwrap{grid-template-columns:minmax(0,1fr)}.plan{position:static}}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.factors{grid-template-columns:minmax(0,1fr)}.crew{grid-template-columns:minmax(0,1fr)}.today .d{display:none}.gantt{--lw:120px;--cw:42px}.mhead h1,.qhead h1{font-size:24px}.wrow{grid-template-columns:110px 1fr 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><i aria-hidden="true"></i>Crewboard<small>by Augmenta</small></div>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="today"><span class="d">Mon Oct 19 · Brightline Painting</span><button class="fb" data-fb="page" title="Leave feedback on this screen">\u{1F4AC} Feedback</button></div>
</div></header>
<main id="app"></main>
<div id="layer"></div>

<script>
/* ============ calendar ============ */
const DAYS=[];(()=>{const d=new Date(2026,9,19);while(DAYS.length<20){const w=d.getDay();if(w>0&&w<6)DAYS.push({dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w],m:d.toLocaleString('en-US',{month:'short'}),n:d.getDate()});d.setDate(d.getDate()+1);}})();
const dlabel=i=>i>19?'after Nov 13':`${DAYS[i].dow} ${DAYS[i].m} ${DAYS[i].n}`;
const sdate=i=>i>19?'later':`${DAYS[i].m} ${DAYS[i].n}`;
const WX=[[0,'sun'],[10,'sun'],[20,'cloud'],[70,'rain'],[60,'rain'],[0,'sun'],[10,'sun'],[20,'cloud'],[55,'rain'],[10,'sun'],[0,'sun'],[10,'sun'],[30,'cloud'],[25,'cloud'],[50,'rain'],[0,'sun'],[10,'sun'],[20,'cloud'],[10,'sun'],[60,'rain']];

function bookings(exceptJob){const b=BOOK0.map(x=>({...x,fixed:true}));

function need(job,crew){return Math.max(1,Math.ceil(job.hours/(CREWS[crew].members.length*8)));}
function span(job,crew,start,B){const n=need(job,crew);let c=0,d=start;const holds=[],conf=[];
 while(c<n){if(d>23)break;if(busy(B,crew,d))conf.push(d);
  if(job.ext&&S.rules.weather&&rain(d)&&!(c===0&&n>=3)){holds.push(d);}else c++;d++;}

function drawer(job){const w=weights(job.id);
 return `<section class="card drawer"><div class="row" style="margin-bottom:8px"><h3 style="font-size:16px" class="grow">How crews are ranked</h3><button class="btn sm line" data-act="resetw">Reset</button></div>
 <div class="tiny" style="margin-bottom:8px">Rules remove crews. Weights rank the rest.</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px">
 <div><div class="eyebrow" style="margin-bottom:4px">Rules</div>
  ${[['lead','Lead-safe painter for pre-1978 homes'],['trust','Trust bar for important clients'],['weather','Hold exterior coats on rain days'],['maxDrive','No crew more than 35 min away']].map(([k,l])=>`<div class="hr"><span class="grow">${l}</span>${k==='trust'?`<span class="stepper"><button data-act="bar" data-v="-1" aria-label="Lower">−</button><b class="num">${S.trustBar}</b><button data-act="bar" data-v="1" aria-label="Raise">+</button></span>`:''}<button class="tog ${S.rules[k]?'on':''}" data-act="rule" data-v="${k}" role="switch" aria-checked="${S.rules[k]}" aria-label="${l}"><i></i></button></div>`).join('')}</div>
 <div><div class="eyebrow" style="margin-bottom:4px">Weights</div>
  ${FACT.map(([k,l])=>`<label class="wrow"><span>${l}</span><input type="range" min="0" max="5" step="1" value="${w[k]||0}" data-w="${k}" id="w-${k}"><b class="num">${w[k]||0}</b></label>`).join('')}</div></div></section>`;}
function mapSvg(job){const P={P:[300,150],CG:[250,80],K:[120,150],SM:[210,120],Westchester:[150,70],'Coral Gables':[250,80],Kendall:[120,150],'South Miami':[210,120],Homestead:[70,205]};
 const jp=P[job.area];const R=rank(job.id);
 return `<svg viewBox="0 0 380 230" role="img" aria-label="Map of crew bases and the job">
 <path d="M340 0 C320 60 330 120 300 230" fill="none" stroke="var(--tape-wash)" stroke-width="40"/>
 <text x="350" y="20" font-size="10" fill="var(--faint)" text-anchor="end">Biscayne Bay</text>
 ${ORDER.map(cr=>{const c=CREWS[cr];const p=P[c.base];const r=R.find(x=>x.crew===cr);return `<line x1="${p[0]}" y1="${p[1]}" x2="${jp[0]}" y2="${jp[1]}" stroke="${c.c}" stroke-width="${r.ok?2.5:1}" stroke-dasharray="${r.ok?'0':'4 4'}" opacity="${r.ok?.9:.4}"/>`;}).join('')}
 ${ORDER.map(cr=>{const c=CREWS[cr];const p=P[c.base];const mx=(p[0]+jp[0])/2,my=(p[1]+jp[1])/2;return `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${c.c}"/><text x="${p[0]}" y="${p[1]+3.5}" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">${cr}</text>
  <text x="${p[0]}" y="${p[1]-14}" font-size="10" fill="var(--soft)" text-anchor="middle">${c.base}</text><rect x="${mx-15}" y="${my-8}" width="30" height="15" rx="4" fill="var(--surface)" stroke="var(--line)"/><text x="${mx}" y="${my+3}" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${DRIVE[cr][job.area]}m</text>`;}).join('')}
 <path d="M${jp[0]} ${jp[1]+2} l-9 -15 a10 10 0 1 1 18 0 z" fill="var(--ink)"/><circle cx="${jp[0]}" cy="${jp[1]-16}" r="4" fill="var(--bg)"/>
 <text x="${jp[0]}" y="${jp[1]+16}" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${job.client.split(' ').slice(-1)[0]} job</text></svg>`;}

/* ---------- board ---------- */
V.board=()=>{const job=J();const B=bookings(job.id);const p=S.place[job.id];const R=rank(job.id);
 const eligible=new Set(R.filter(r=>r.ok).map(r=>r.crew));
 const lw='var(--lw)',cw='var(--cw)';
 const pos=(s,e)=>`left:calc(${lw} + ${cw} * ${s} + 2px);width:calc(${cw} * ${e-s+1} - 4px)`;
 const head=`<div class="grow-h"><div class="lab" style="padding:6px 12px;justify-content:flex-end"><span class="tiny">Crew</span></div>${DAYS.map((d,i)=>`<div class="gh ${d.dow==='Mon'&&i?'wk':''} ${i===0?'today':''}">${d.dow.slice(0,2)}<b class="num">${d.n}</b></div>`).join('')}</div>
  <div class="wx"><div class="lab" style="padding:4px 12px"><span class="tiny">Forecast</span></div>${WX.map(([pp,t],i)=>`<div class="${rain(i)?'rain':''}" title="${t==='rain'?'Rain':t==='cloud'?'Cloudy':'Sunny'} ${pp}%">${wxIcon(t)}<span class="num">${pp}%</span></div>`).join('')}</div>`;
 const rows=ORDER.map(cr=>{const c=CREWS[cr];const ok=eligible.has(cr);const rr=R.find(x=>x.crew===cr);
  const bars=B.filter(x=>x.crew===cr).map(x=>`<div class="bk ${x.prop?'prop':''}" style="--c:${c.c};${pos(x.s,Math.min(19,x.e))}"><b>${esc(x.name)}</b><span>${esc(x.what)}</span></div>`).join('');
  const ghost=!p&&ok&&rr.slot?`<button class="ghost" data-act="place" data-v="${cr}" style="${pos(rr.slot.s,Math.min(19,rr.slot.e))}" aria-label="Place on ${c.name}, match ${rr.score}">${rr.score} · ${rr===R[0]?'Best fit':'Option'}</button>`:'';
  let nb='';if(p&&p.crew===cr){const sp=span(job,cr,p.s,B);const days=[];for(let d=sp.s;d<=sp.e;d++)days.push(d);let wi=0;
   nb=`<div class="nb ${(sp.conf.length||!ok||sp.e>job.deadline)?'badpos':''}" id="nb" style="${pos(sp.s,Math.min(19,sp.e))}" role="button" tabindex="0" aria-label="${job.title}, drag to move">${days.filter(d=>d<20).map(d=>{const h=sp.holds.includes(d);const ph=h?'Weather hold':job.phases[Math.min(job.phases.length-1,Math.floor(wi++*job.phases.length/sp.n))];return `<div class="ph ${h?'hold':''}"><b>${h?'Hold':esc(ph.split(' ')[0])}</b>${h?'Rain':esc(ph.split(' ').slice(1).join(' '))}</div>`;}).join('')}</div>`;}
  return `<div class="crow ${!ok?'inel':''}" data-crew="${cr}"><div class="lab" style="position:absolute;left:0;top:0;bottom:0;width:var(--lw)"><b><span class="dot" style="--c:${c.c}"></span>${c.name}</b><span>${c.members.length} painters · ${tdots(S.trust[cr])}</span><span class="num">${util(B,cr)}% booked${!ok?' · <b style="color:var(--bad);font-size:11px;display:inline">can’t take it</b>':''}</span></div>
   <div class="cells">${DAYS.map((d,i)=>`<div class="${d.dow==='Mon'&&i?'wk':''} ${rain(i)?'rain':''}"></div>`).join('')}</div>${bars}${ghost}${nb}</div>`;}).join('');
 const cap=`<div class="cap"><div class="lab" style="padding:4px 12px"><span class="tiny">Crews free</span></div>${DAYS.map((d,i)=>{const free=ORDER.filter(cr=>!busy(bookings(),cr,i)).length;return `<div style="background:color-mix(in srgb,var(--good) ${free*16}%,transparent)" class="num">${free}</div>`;}).join('')}</div>`;
 const dl=job.deadline<20?`<div class="dl" style="left:calc(var(--lw) + var(--cw) * ${job.deadline+1})"><span>Due ${sdate(job.deadline)}</span></div>`:'';
 return `<button class="back" data-go="${p&&p.status==='scheduled'?'queue':'match'}">← ${p&&p.status==='scheduled'?'Ready to schedule':'Crew ranking'}</button>
 <div class="mhead"><div class="grow"><div class="eyebrow">Schedule</div><h1>${job.title}</h1></div>
  <div class="seg" role="group" aria-label="Job">${QORDER.map(j=>`<button aria-pressed="${j===S.job}" data-act="setjob" data-v="${j}">${JOBS[j].title.split(' ')[0]}${S.place[j]?.status==='scheduled'?' ✓':''}</button>`).join('')}</div>${fbBtn('board')}</div>
 <div class="banner">${p?`<b>${CREWS[p.crew].name}, ${dlabel(p.s)} to ${dlabel(span(job,p.crew,p.s,B).e)}.</b><span class="muted small">Drag the blue bar to another day or crew. Checks update as you move it.</span>`:
  `<b>Pick a slot.</b><span class="muted small">Dashed outlines are the earliest opening for each crew that passes the rules, with its match score. Striped rows can’t take this job.</span>`}</div>
 <div class="boardwrap"><div><div class="card gscroll"><div class="gantt" id="gantt">${head}${rows}${cap}${dl}</div></div>
  <div class="legend"><span><i style="background:var(--tape)"></i>This job</span><span><i style="border:2px dashed var(--tape)"></i>Suggested slot</span><span><i style="background:repeating-linear-gradient(135deg,var(--tape) 0 3px,transparent 3px 6px)"></i>Weather hold</span><span><i style="background:var(--sunk);border:1px dashed var(--faint)"></i>Proposed, not confirmed</span><span><i style="background:color-mix(in srgb,var(--good) 50%,transparent)"></i>More crews free</span></div></div>
  ${planPanel(job,B,eligible)}</div>`;};
function planPanel(job,B,eligible){const p=S.place[job.id];
 if(!p) return `<aside class="card plan"><h3 style="font-size:17px">Plan</h3><p class="small muted">Pick a dashed slot to see checks, crew hours, and the messages that go out.</p>
  <div class="eyebrow" style="margin-top:14px">Best fit</div>${(()=>{const r=rank(job.id).find(x=>x.ok);return r?`<div class="row" style="margin-top:6px"><span class="dot" style="--c:${CREWS[r.crew].c}"></span><b class="grow">${CREWS[r.crew].name}</b><span class="chip tape num">${r.score}</span></div><div class="small muted" style="margin-top:4px">${dlabel(r.slot.s)} to ${dlabel(r.slot.e)}</div><button class="btn tape sm" style="margin-top:10px" data-act="place" data-v="${r.crew}">Use this slot</button>`:'<div class="small">No crew fits.</div>';})()}</aside>`;
 const c=CREWS[p.crew];const sp=span(job,p.crew,p.s,B);const ok=eligible.has(p.crew);const fails=hard(job,p.crew);const sched=p.status==='scheduled';
 const planned=sp.n*c.members.length*8;
 const checks=[];
 if(ok)checks.push(['ok',`${c.name} passes every rule`]);else fails.forEach(f=>checks.push(['no',f]));
 if(sp.conf.length)checks.push(['no',`Overlaps ${B.find(x=>x.crew===p.crew&&sp.conf.includes(x.s)||x.crew===p.crew&&sp.conf.some(d=>d>=x.s&&d<=x.e))?.name||'another job'} on ${sp.conf.map(sdate).join(', ')}`]);
 if(sp.e>job.deadline)checks.push(['no',`Finishes ${sdate(sp.e)}, after the ${sdate(job.deadline)} deadline`]);else checks.push(['ok',`Finishes ${dlabel(sp.e)}, ${job.deadline-sp.e} days to spare`]);
 sp.holds.forEach(d=>checks.push(['wn',`${dlabel(d)}: rain ${WX[d][0]}%. Weather hold, crew does covered prep and the front door`]));
 if(job.ext&&!sp.holds.length&&sp.s<20&&rain(sp.s))checks.push(['wn',`Day 1 is rainy. Fine for pressure washing`]);
 if(job.built<1978&&c.certs.includes('leadsafe'))checks.push(['ok',`Lead-safe: ${c.members.find(m=>m[1])[0]} is certified and on site`]);
 checks.push([planned>job.hours*1.1?'wn':'ok',`${planned} crew hours planned for ${job.hours} estimated${planned>job.hours*1.1?'. Expect a short last day':''}`]);
 const lead=c.lead;const sp1=dlabel(sp.s),spE=dlabel(sp.e);
 const msgs={crew:{to:`${lead} · WhatsApp`,x:`New job: ${job.title}\n${sp1} to ${spE}, start 8am\n${job.ext?'Exterior. Wash day 1, body coats on dry days only. HOA hours 8 to 5.':'Interior.'}\n${job.built<1978?'Lead-safe setup required.\n':''}Colors: ${job.colors.map(x=>x[0]).join(', ')}\nFull work order in the app.`},
  client:{to:`${job.client.split(' ')[0]} · Text${job.lang==='spanish'?' in Spanish':''}`,x:job.lang==='spanish'?`Hola Rosa, su proyecto de pintura empieza el ${sp1.replace('Mon','lunes').replace('Tue','martes').replace('Wed','miércoles').replace('Thu','jueves').replace('Fri','viernes')}. El equipo de ${lead} estará a las 8am. Si llueve, le avisamos. ¿Alguna pregunta? Respóndanos aquí.`:`Hi ${job.client.split(' ')[0]}, your project starts ${sp1}. ${lead}’s crew arrives at 8am. Reply here with any questions.`},
  hoa:{to:'HOA office · Email',x:`Work notice for the ${job.client.split(' ').slice(-1)[0]} residence: exterior painting ${sp1} to ${spE}, weekdays 8am to 5pm. Approved colors on file (Oct 16).`},
  supplier:{to:'Sherwin-Williams · PO',x:`Paint already delivered Oct 23. Hold 2 gal Loxon touch-up for pickup ${dlabel(Math.max(0,sp.e-1))}.`}};
 const tabs=job.ext&&job.writeup.includes('[hoa|')?['crew','client','hoa','supplier']:['crew','client','supplier'];
 const m=msgs[S.msgTab]||msgs.crew;
 return `<aside class="card plan"><div class="row"><span class="dot" style="--c:${c.c}"></span><h3 style="font-size:17px" class="grow">${c.name}</h3><span class="chip ${sched?'good':'tape'}">${sched?'Scheduled':'Draft'}</span></div>
 <div class="small muted" style="margin:4px 0 10px">${dlabel(sp.s)} to ${dlabel(sp.e)} · ${sp.n} work days${sp.holds.length?` + ${sp.holds.length} hold`:''}</div>
 ${checks.map(([k,t])=>`<div class="check ${k}"><i>${k==='ok'?'✓':k==='wn'?'!':'×'}</i><span>${esc(t)}</span></div>`).join('')}
 <div class="eyebrow" style="margin-top:14px">What goes out on confirm</div>
 <div class="msgtabs" role="group">${tabs.map(t=>`<button aria-pressed="${S.msgTab===t||(!tabs.includes(S.msgTab)&&t==='crew')}" data-act="msg" data-v="${t}">${{crew:'Crew lead',client:'Client',hoa:'HOA',supplier:'Supplier'}[t]}</button>`).join('')}</div>
 <div class="tiny" style="margin-bottom:4px">${m.to}</div><div class="bubble">${esc(m.x)}</div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${sched?`<button class="btn line" data-act="unschedule">Unschedule</button>`:`<button class="btn tape" data-act="confirm" ${(ok&&!sp.conf.length&&sp.e<=job.deadline)?'':'disabled'}>Confirm and notify</button><button class="btn line" data-act="clear">Clear</button>`}</div>
 ${!sched&&!(ok&&!sp.conf.length&&sp.e<=job.deadline)?'<div class="tiny" style="margin-top:8px">Fix the red checks to confirm.</div>':''}</aside>`;}

 const TOG={'Yesenia|Mateo':31,'Yesenia|Jorge':24,'Mateo|Jorge':22,'Carlos|Ana':38,'Carlos|Luis M.':16,'Ana|Luis M.':15,'Marcus|Dev':19,'Marcus|Pete':9,'Dev|Pete':10,'Jorge|Marcus':4,'Ana|Mateo':3,'Carlos|Yesenia':2,'Luis M.|Dev':5};

  <div class="chips">${c.skills.map(k=>`<span class="chip">${SKILL[k]}</span>`).join('')}${c.certs.map(k=>`<span class="chip good">${SKILL[k]}</span>`).join('')}${c.spanish?'<span class="chip tape">Spanish</span>':''}</div>
  <div class="stats"><div><b class="num">${c.ytd}</b><span>Jobs this year</span></div><div><b class="num" style="color:${c.over>0?'var(--warn)':'var(--good)'}">${c.over>0?'+':''}${c.over}%</b><span>Hours vs est.</span></div><div><b class="num">${c.cb}%</b><span>Callbacks</span></div><div><b class="num">${c.rating}</b><span>Client rating</span></div></div>
  <div class="small muted">${c.together} jobs together as this crew · ${util(B,cr)}% booked next 4 weeks</div></article>`;}).join('')}</div>
 <section class="card pad" style="margin-top:16px"><div class="row" style="margin-bottom:10px"><div class="grow"><h3 style="font-size:17px">Who works well together</h3><div class="small muted">Jobs finished side by side in the last 12 months. Pairs that stay together run closer to estimate.</div></div>${fbBtn('pairs')}</div>
  <div class="matrix"><table><tr><th></th>${people.map(([n])=>`<th class="rot"><span>${n}</span></th>`).join('')}</tr>
  ${people.map(([a,ca])=>`<tr><th style="text-align:right"><span class="dot" style="--c:${CREWS[ca].c};display:inline-block;margin-right:6px"></span>${a}</th>${people.map(([b])=>{if(a===b)return '<td style="background:var(--sunk)"></td>';const v=tg(a,b);return `<td style="background:color-mix(in srgb,var(--tape) ${Math.min(90,v*2.4)}%,var(--sunk));color:${v>22?'var(--tape-ink)':'var(--ink)'}">${v||''}</td>`;}).join('')}</tr>`).join('')}</table></div></section>`;};

  ['Fair work distribution','Balance good jobs across crews over the month.','Later','']]]];
V.ideas=()=>`<div class="qhead"><div class="grow"><div class="eyebrow">Idea bank</div><h1>Where this could go</h1><p class="muted" style="margin:6px 0 0;max-width:640px">Everything we considered, grouped. Tags show what’s in this prototype. Leave feedback on any card.</p></div></div>
 ${IDEAS.map(([cat,list])=>`<h2 class="icat">${cat}</h2><div class="igrid">${list.map(([t,d,tag,src],i)=>`<article class="card idea" id="idea-${cat.slice(0,4)}-${i}"><div class="row"><span class="chip ${tag==='In this prototype'?'tape':tag==='Next'?'good':''}">${tag}</span><span class="grow"></span>${fbBtn('idea','')}</div><h3>${t}</h3><p>${d}</p>${src?`<span class="tiny">Seen in: ${src}</span>`:''}</article>`).join('')}</div>`).join('')}`;

/* ============ render ============ */
function render(){
 $('#tabs').innerHTML=[['queue','Ready to schedule',QORDER.filter(j=>S.place[j]?.status!=='scheduled').length],['board','Board'],['crews','Crews'],['ideas','Ideas']].map(([v,l,n])=>`<button data-go="${v}" ${S.view===v||(S.view==='match'&&v==='queue')?'aria-current="page"':''}>${l}${n?`<span class="ct num">${n}</span>`:''}</button>`).join('');
 $('#app').innerHTML=V[S.view]();
 bindDrag(); drawLayer();}
function drawLayer(){let h='';
 if(S.modal){const m=S.modal;h+=`<div class="ov" data-act="closemodal"><div class="card modal" role="dialog" aria-label="Plan for all jobs" onclick="event.stopPropagation()">
  <div class="eyebrow">Plan all</div><h2 style="font-size:24px;margin:2px 0 6px">${m.items.length} jobs placed</h2><p class="small muted" style="margin:0 0 12px">Important and earliest-due first. Each job takes the best crew that’s still free. Nothing is sent until you confirm.</p>
  ${m.items.map(it=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><span class="dot" style="--c:${CREWS[it.crew].c}"></span><div class="grow"><b>${JOBS[it.jid].title}</b><div class="small muted">${CREWS[it.crew].name} · ${dlabel(it.s)} to ${dlabel(it.e)}</div></div><span class="chip tape num">${it.score}</span></div>`).join('')}
  ${m.skipped.map(j=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><span class="dot" style="--c:var(--bad)"></span><div class="grow"><b>${JOBS[j].title}</b><div class="small muted">No crew passes the rules</div></div></div>`).join('')}
  <div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><span class="small grow">In-house crews booked: <b class="num">${m.before}% → ${m.after}%</b></span></div>
  <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn tape" data-act="confirmall">Confirm all and notify</button><button class="btn line" data-act="reviewall">Review on the board</button></div></div></div>`;}
 if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
 $('#layer').innerHTML=h;}

/* ============ drag on board ============ */
function bindDrag(){const nb=document.getElementById('nb');if(!nb)return;const g=document.getElementById('gantt');
 let st=null;
 nb.addEventListener('pointerdown',e=>{const p=S.place[S.job];if(!p||p.status==='scheduled')return;nb.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,s:p.s,crew:p.crew,moved:false};nb.classList.add('dragging');});
 nb.addEventListener('pointermove',e=>{if(!st)return;const cwPx=parseFloat(getComputedStyle(g).getPropertyValue('--cw'));const dx=Math.round((e.clientX-st.x)/cwPx);
  nb.style.transform=`translate(${dx*cwPx}px,${e.clientY-st.y}px)`;st.moved=true;
  document.querySelectorAll('.crow').forEach(r=>{const b=r.getBoundingClientRect();r.classList.toggle('drop',e.clientY>=b.top&&e.clientY<b.bottom);});});
 const end=e=>{if(!st)return;const cwPx=parseFloat(getComputedStyle(g).getPropertyValue('--cw'));const dx=Math.round((e.clientX-st.x)/cwPx);
  let crew=st.crew;document.querySelectorAll('.crow').forEach(r=>{const b=r.getBoundingClientRect();if(e.clientY>=b.top&&e.clientY<b.bottom)crew=r.dataset.crew;});
  const s=Math.max(0,Math.min(19,st.s+dx));const p=S.place[S.job];p.s=s;p.crew=crew;const sp=span(J(),crew,s,bookings(S.job));p.e=sp.e;st=null;render();};
 nb.addEventListener('pointerup',end);nb.addEventListener('pointercancel',end);
 nb.addEventListener('keydown',e=>{const p=S.place[S.job];if(!p||p.status==='scheduled')return;let d=0,cr=ORDER.indexOf(p.crew);
  if(e.key==='ArrowRight')d=1;else if(e.key==='ArrowLeft')d=-1;else if(e.key==='ArrowDown')cr=Math.min(ORDER.length-1,cr+1);else if(e.key==='ArrowUp')cr=Math.max(0,cr-1);else return;
  e.preventDefault();p.s=Math.max(0,Math.min(19,p.s+d));p.crew=ORDER[cr];p.e=span(J(),p.crew,p.s,bookings(S.job)).e;render();document.getElementById('nb')?.focus();});}

/* ============ actions ============ */
function placeJob(jid,crew){const r=rank(jid).find(x=>x.crew===crew);const job=JOBS[jid];const sl=r.slot||span(job,crew,job.earliest,bookings(jid));S.place[jid]={crew,s:sl.s,e:sl.e,status:'draft'};}
function planAll(){const B0=bookings();const before=Math.round(ORDER.slice(0,4).reduce((a,c)=>a+util(B0,c),0)/4);const items=[],skipped=[];
 const todo=QORDER.filter(j=>S.place[j]?.status!=='scheduled').sort((a,b)=>(!!JOBS[b].important-!!JOBS[a].important)||(JOBS[a].deadline-JOBS[b].deadline));
 todo.forEach(j=>{delete S.place[j];});
 todo.forEach(j=>{const r=rank(j).find(x=>x.ok);if(!r){skipped.push(j);return;}S.place[j]={crew:r.crew,s:r.slot.s,e:r.slot.e,status:'draft'};items.push({jid:j,crew:r.crew,s:r.slot.s,e:r.slot.e,score:r.score});});
 const B1=bookings();const after=Math.round(ORDER.slice(0,4).reduce((a,c)=>a+util(B1,c),0)/4);S.modal={items,skipped,before,after};}
document.addEventListener('click',async e=>{const fb=e.target.closest('[data-fb]');if(fb){feedback(fb);return;}
 const go=e.target.closest('[data-go]');if(go){S.view=go.dataset.go;render();window.scrollTo(0,0);return;}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
 switch(a){
 case 'match':S.job=v;S.view='match';render();window.scrollTo(0,0);break;
 case 'board':S.job=v;S.view='board';render();window.scrollTo(0,0);break;
 case 'setjob':S.job=v;render();break;
 case 'preset':delete S.w[S.job];S.preset[S.job]=v;render();break;
 case 'drawer':S.drawer=!S.drawer;render();break;
 case 'resetw':delete S.w[S.job];delete S.preset[S.job];render();break;
 case 'rule':S.rules[v]=!S.rules[v];render();toast(`${S.rules[v]?'Rule on':'Rule off'}. Ranking updated`);break;
 case 'bar':S.trustBar=Math.max(1,Math.min(5,S.trustBar+ +v));render();break;
 case 'toggleout':S.showOut=!S.showOut;render();break;
 case 'trustup':S.trust[v]=S.trustBar;render();toast(`${CREWS[v].name} trust raised to ${S.trustBar}. They’re in the running`);break;
 case 'trust':S.trust[v]=Math.max(1,Math.min(5,S.trust[v]+ +b.dataset.d));render();break;
 case 'pick':placeJob(S.job,v);S.view='board';render();window.scrollTo(0,0);toast(`Placed on ${CREWS[v].name}. Drag to adjust`);break;
 case 'place':placeJob(S.job,v);render();toast(`Placed on ${CREWS[v].name}. Drag to adjust`);break;
 case 'quick':placeJob(v,rank(v).find(x=>x.ok).crew);S.place[v].status='scheduled';render();toast(`${JOBS[v].title} booked on ${CREWS[S.place[v].crew].name}. Crew and client notified`);break;
 case 'msg':S.msgTab=v;render();break;
 case 'confirm':S.place[S.job].status='scheduled';render();toast(`Scheduled. ${CREWS[S.place[S.job].crew].lead}, the client${J().writeup.includes('[hoa|')?', the HOA':''} and the supplier are notified`);break;
 case 'clear':delete S.place[S.job];render();break;
 case 'unschedule':S.place[S.job].status='draft';render();toast('Back to draft. Nobody has been told yet');break;
 case 'planall':planAll();render();break;
 case 'closemodal':S.modal=null;drawLayer();break;
 case 'reviewall':S.modal=null;S.job=QORDER.find(j=>S.place[j])||'hernandez';S.view='board';render();window.scrollTo(0,0);break;
 case 'confirmall':Object.values(S.place).forEach(p=>p.status='scheduled');const n=S.modal.items.length;S.modal=null;render();toast(`${n} jobs scheduled. Crews and clients notified`);break;
 }});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.w){const w={...weights(S.job)};w[t.dataset.w]=+t.value;S.w[S.job]=w;render();const el=document.getElementById(t.id);if(el)el.focus();}});
document.addEventListener('mouseover',e=>{const r=e.target.closest('.req');document.querySelectorAll('.writeup mark').forEach(m=>m.classList.toggle('on',!!r&&m.dataset.k===r.dataset.k));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;drawLayer();}});

/* ============ feedback via comments ============ */
let COMMENTS=null;
(async()=>{try{if(!window.claude||!window.claude.use)return;COMMENTS=await window.claude.use('comments');if(COMMENTS)document.documentElement.classList.add('has-comments');}catch(_){}})();
async function feedback(btn){if(!COMMENTS)return;const target=btn.dataset.fb==='page'?document.getElementById('app'):(btn.closest('article,section,.card')||document.getElementById('app'));
 try{const r=await COMMENTS.openComposer({element:target});if(!r.opened)toast('Finish the comment you have open first');}catch(err){if(err&&err.code==='unavailable'){document.documentElement.classList.remove('has-comments');}else toast('Comments aren’t available here');}}
render();
</script>
