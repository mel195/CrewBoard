/* Layout: app shell with top nav; queue grid, match split view, gantt board with side plan panel */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#1A1D21; --soft:#596068; --faint:#949AA1; --line:#DFE2DC;
  --tape:#2F6BD8; --tape-ink:#FFFFFF; --tape-wash:#E4ECFB;
  --good:#4E8C14; --good-wash:#E6F2D7; --warn:#A86A00; --warn-wash:#FBEFD6; --bad:#BF3B28; --bad-wash:#FAE2DD;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161A; --surface:#1D2025; --sunk:#181A1E; --ink:#ECEDEA; --soft:#A9AEB4; --faint:#747A81; --line:#30343A;
  --tape:#6C9BF0; --tape-ink:#0E1730; --tape-wash:#1F2B45;
  --good:#8CC556; --good-wash:#1F2E16; --warn:#E3A93E; --warn-wash:#34280F; --bad:#EE7B66; --bad-wash:#3A1D18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1D2025; --sunk:#181A1E; --ink:#ECEDEA; --soft:#A9AEB4; --faint:#747A81; --line:#30343A;
  --tape:#6C9BF0; --tape-ink:#0E1730; --tape-wash:#1F2B45;
  --good:#8CC556; --good-wash:#1F2E16; --warn:#E3A93E; --warn-wash:#34280F; --bad:#EE7B66; --bad-wash:#3A1D18; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--tape);display:grid;place-items:center;transform:rotate(-6deg)}
.brand i::after{content:"";width:14px;height:4px;background:var(--tape-ink);border-radius:2px;opacity:.85}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--faint);margin-left:2px}
nav.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--soft);white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav.tabs .ct{background:var(--tape);color:var(--tape-ink);border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.today{margin-left:auto;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:12px}
main{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
.fb{display:none;border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--soft);align-items:center;gap:6px}
.has-comments .fb{display:inline-flex}
.fb:hover{border-color:var(--tape);color:var(--tape)}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--soft)} .tiny{font-size:12px;color:var(--faint)} .small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--soft);white-space:nowrap}
.chip.tape{background:var(--tape-wash);color:var(--tape)}
.chip.good{background:var(--good-wash);color:var(--good)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px}
.btn.tape{background:var(--tape);color:var(--tape-ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h h2{font-size:22px}
/* queue */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--soft)}
.qhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.qhead h1{font-size:30px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.job{overflow:hidden;display:flex;flex-direction:column}
.chipband{display:flex;height:54px}
.chipband div{flex:1;position:relative}
.chipband div span{position:absolute;left:8px;bottom:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.job .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.job h3{font-size:19px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--sunk);border-radius:8px;padding:7px 9px}
.facts b{display:block;font-size:14.5px}
.facts span{font-size:11.5px;color:var(--soft)}
.rec{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* match */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px;margin-bottom:18px}
.mhead h1{font-size:30px}
.back{border:0;background:none;color:var(--tape);font-weight:700;padding:0;margin-bottom:6px}
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.writeup{font-size:13.5px;line-height:1.6;color:var(--soft)}
.writeup mark{background:transparent;color:var(--ink);border-bottom:2px solid var(--tape);padding:0 1px;border-radius:2px;transition:background .15s}
.writeup mark.on{background:var(--tape-wash)}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-bottom:10px}
.reqs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.req{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--sunk);font-size:13.5px}
.req .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.req.must .ic{background:var(--ink);color:var(--bg)}
.req.nice .ic{background:var(--surface);color:var(--soft);border:1px solid var(--line)}
.req small{display:block;color:var(--faint);font-size:11.5px}
.tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.crew{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;margin-bottom:12px}
.ring{width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px}
.ring small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;color:var(--faint);font-weight:600}
.members{display:flex;gap:4px;flex-wrap:wrap}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c);position:relative}
.av.cert::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.factors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin-top:12px}
.f{display:grid;grid-template-columns:104px 1fr 28px;align-items:center;gap:8px;font-size:12.5px}
.f .bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.f .bar i{display:block;height:100%;background:var(--tape);border-radius:4px}
.f.w0{opacity:.4}
.f .v{text-align:right;color:var(--soft);font-size:12px}
.why{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.why li{display:flex;gap:8px}
.why li::before{content:"+";font-weight:800;color:var(--good)}
.why li.minus::before{content:"\2013";color:var(--warn)}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.out{padding:12px 16px;display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line)}
.out:first-of-type{border-top:0}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rule{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--good-wash);color:var(--good)}
.rule.x{background:var(--bad-wash);color:var(--bad)}
.mapcard svg{width:100%;height:auto;display:block}
.drawer{padding:16px;margin-bottom:14px}
.wrow{display:grid;grid-template-columns:150px 1fr 26px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.wrow input{width:100%;accent-color:var(--tape)}
.tog{width:40px;height:24px;border-radius:12px;border:0;background:var(--line);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--tape)} .tog.on i{left:19px}
.hr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hr:last-child{border-bottom:0}
/* board */
.boardwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;margin-bottom:12px;background:var(--tape-wash);border:1px solid transparent;border-radius:var(--r)}
.gscroll{overflow-x:auto;border-radius:var(--r)}
.gantt{--cw:46px;--lw:170px;min-width:calc(var(--lw) + var(--cw)*20);position:relative;user-select:none}
.grow-h,.grow-r{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw))}
.gh{font-size:11px;text-align:center;padding:6px 0 4px;color:var(--soft);border-left:1px solid var(--line)}
.gh b{display:block;font-size:13px;color:var(--ink)}
.gh.wk{border-left:2px solid var(--faint)}
.gh.gtoday b{color:var(--tape)}
.wx{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw));border-bottom:1px solid var(--line)}
.wx div{display:grid;place-items:center;padding:4px 0;font-size:10.5px;color:var(--soft);border-left:1px solid var(--line)}
.wx div.rain{background:color-mix(in srgb,var(--tape) 10%,transparent)}
.wx svg{width:18px;height:18px}
.lab{padding:10px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;justify-content:center;background:var(--surface);position:sticky;left:0;z-index:3}
.lab b{font-size:13.5px;display:flex;gap:7px;align-items:center}
.lab span{font-size:11.5px;color:var(--soft)}
.crow{position:relative;border-bottom:1px solid var(--line);height:64px}
.crow .cells{position:absolute;inset:0 0 0 var(--lw);display:grid;grid-template-columns:repeat(20,var(--cw))}
.crow .cells div{border-left:1px solid var(--line)}
.crow .cells div.wk{border-left:2px solid var(--line)}
.crow .cells div.rain{background:color-mix(in srgb,var(--tape) 5%,transparent)}
.crow.drop{background:var(--tape-wash)}
.crow.inel .cells{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--bad) 7%,transparent) 8px 10px)}
.bk{position:absolute;top:10px;height:44px;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--ink);z-index:1}
.bk b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{color:var(--soft);white-space:nowrap}
.bk.prop{border-style:dashed}
.ghost{position:absolute;top:8px;height:48px;border:2px dashed var(--tape);border-radius:9px;background:color-mix(in srgb,var(--tape) 8%,transparent);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:700;color:var(--tape);z-index:2}
.ghost:hover{background:color-mix(in srgb,var(--tape) 16%,transparent)}
.nb{position:absolute;top:8px;height:48px;border-radius:9px;background:var(--tape);color:var(--tape-ink);z-index:4;display:flex;overflow:hidden;cursor:grab;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--tape) 70%,transparent);touch-action:none}
.nb.dragging{cursor:grabbing;opacity:.92}
.nb.badpos{background:var(--bad)}
.nb .ph{flex:1;padding:5px 7px;font-size:11px;line-height:1.2;border-right:1px solid color-mix(in srgb,var(--tape-ink) 25%,transparent);overflow:hidden;white-space:nowrap}
.nb .ph:last-child{border-right:0}
.nb .ph b{display:block;font-size:11.5px}
.nb .hold{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--tape-ink) 22%,transparent) 6px 9px)}
.dl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--bad);z-index:5;pointer-events:none}
.dl span{position:absolute;top:2px;left:4px;font-size:10.5px;font-weight:700;color:var(--bad);white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.cap{display:grid;grid-template-columns:var(--lw) repeat(20,var(--cw))}
.cap div{height:26px;display:grid;place-items:center;font-size:11px;font-weight:700;border-left:1px solid var(--line)}
.plan{padding:16px;position:sticky;top:76px}
.check{display:flex;gap:8px;font-size:13px;padding:5px 0}
.check i{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;margin-top:1px}
.check.ok i{background:var(--good-wash);color:var(--good)}
.check.wn i{background:var(--warn-wash);color:var(--warn)}
.check.no i{background:var(--bad-wash);color:var(--bad)}
.msgtabs{display:flex;gap:4px;margin:12px 0 8px;flex-wrap:wrap}
.msgtabs button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--soft)}
.msgtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bubble{background:var(--sunk);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:13px;white-space:pre-line}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* crews */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ccard{padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.stats b{display:block;font-size:14.5px}
.stats span{font-size:11px;color:var(--soft)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.tdots{display:inline-flex;gap:3px}
.tdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--tape)}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:12px}
.matrix th{font-weight:600;color:var(--soft);padding:2px 4px;white-space:nowrap}
.matrix th.rot{height:70px;vertical-align:bottom}
.matrix th.rot span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg)}
.matrix td{width:34px;height:30px;text-align:center;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
/* ideas */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.idea{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.idea h3{font-size:16px}
.idea p{margin:0;font-size:13.5px;color:var(--soft)}
.icat{margin:26px 0 12px;font-size:20px}
/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:50;display:grid;place-items:center;padding:16px}
.modal{max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.steps[hidden]{display:none}
.steps{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.stp{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--faint)}
.stp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--sunk);color:var(--soft)}
.stp.on{color:var(--ink)} .stp.on i{background:var(--tape);color:var(--tape-ink)}
.stp.done{color:var(--good)} .stp.done i{background:var(--good-wash);color:var(--good)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;background:var(--sunk);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--tape);background:var(--tape-wash)}
.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:14px}
.fld{display:grid;grid-template-columns:110px minmax(0,1fr) 78px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .chip{justify-self:end}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prog li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--faint)}
.prog li i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;border:2px solid var(--line)}
.prog li.run{color:var(--ink)} .prog li.run i{border-color:var(--tape);border-top-color:transparent;animation:spin .8s linear infinite}
.prog li.done{color:var(--ink)} .prog li.done i{background:var(--good);border-color:var(--good);color:#fff}
.prog li.fail{color:var(--bad)} .prog li.fail i{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.skc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--faint)}
.skc.must{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skc.nice{background:var(--tape-wash);color:var(--tape);border-color:transparent}
.addsplit{grid-template-columns:minmax(0,1fr) minmax(0,520px)}
@media (max-width:1080px){.addsplit{grid-template-columns:1fr}.addsplit>section:first-child{order:2}}
@media (max-width:560px){.fld{grid-template-columns:1fr auto}.fld>span:nth-child(2){grid-column:1/-1;grid-row:2}}
.lines{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ln{display:flex;gap:10px;align-items:center;font-size:13.5px}
.ln svg{width:16px;height:16px;flex:none;color:var(--soft)}
.ln small{color:var(--soft);font-size:12.5px}
.prio{margin-bottom:16px;padding:16px 18px;border-radius:var(--r);background:linear-gradient(135deg,var(--tape-wash),transparent 70%);border:1px solid var(--line)}
.prio-t{display:flex;align-items:center;gap:12px}
.prio-ic{width:40px;height:40px;border-radius:12px;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;flex:none}
.prio h2{font-size:26px;line-height:1.1}
.prio-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--soft);display:inline-flex;gap:6px;align-items:center}
.pill:hover{border-color:var(--tape)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill small{font-weight:500;opacity:.7;font-size:11px}
.near{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.near:first-of-type{border-top:0}
.near.off{opacity:.45}
.nbar{height:5px;background:var(--sunk);border-radius:3px;margin-top:6px;overflow:hidden}
.nbar i{display:block;height:100%;border-radius:3px}
.arr{width:24px;height:24px;display:grid;place-items:center;color:var(--ink);flex:none}
.lcol{display:flex;flex-direction:column;gap:14px}
.estrip{margin-bottom:16px}
.others{margin:2px 0 12px}
.crew.best{border:2px solid var(--tape)}
button.av{border:0;padding:0;cursor:pointer}
button.av:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{border:0;background:var(--sunk);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--soft);display:inline-flex;gap:5px;align-items:center}
button.lk:hover{color:var(--ink)}
.lk.good{background:var(--good-wash);color:var(--good)}
.lk.warn{background:var(--warn-wash);color:var(--warn)}
.facts.f4{grid-template-columns:repeat(2,minmax(0,1fr))}
.nb{flex-direction:column}
.nbt{font-size:11.5px;font-weight:800;padding:3px 8px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid color-mix(in srgb,var(--tape-ink) 20%,transparent)}
.nbd{display:flex;flex:1;min-height:0}
.nb .ph{font-size:11px;font-weight:600;padding:3px 6px;display:flex;align-items:center}
.nb .ph.pz{background:var(--surface);color:var(--soft);border-top:2px dashed var(--tape);border-bottom:2px dashed var(--tape)}
button.bk{text-align:left;cursor:pointer;font:inherit;font-size:11.5px}
button.bk:hover{border-color:var(--c);box-shadow:0 2px 8px -3px color-mix(in srgb,var(--c) 60%,transparent)}
.gantt.cal{--cw:56px}
.crow.tall{height:68px}
.crow .cells div.idle{background:color-mix(in srgb,var(--warn) 12%,transparent);display:grid;place-items:end center}
.crow .cells div.idle span{font-size:10px;font-weight:700;color:var(--warn);padding-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.calf{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:14px}
.fgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filt{display:inline-flex;gap:6px;flex-wrap:wrap}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:10px}
.kpi span{display:block}
.lrow{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
.lrow:first-child{border-top:0}
.safe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.safe p{margin:4px 0 0}
.tscroll{overflow-x:auto}
.atable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.atable th,.atable td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.atable th{font-size:11.5px;color:var(--faint);font-weight:700}
.atable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.card>.ob8:first-child,.ob8d>.ob8:first-of-type{border-top:0}
.ob8 .obn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--soft);flex:none}
.ob8.now .obn{background:var(--tape);color:var(--tape-ink)}
.ob8.done .obn{background:var(--good-wash);color:var(--good)}
.ob8d{margin-top:18px;padding:12px 16px}
.ob8d summary{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0;color:var(--ink)}
.ob8d[open] summary{margin-bottom:8px}
@media(max-width:1080px){.split.m8{grid-template-columns:minmax(0,1fr)}.split.m8>.lcol{order:0}}
@media(max-width:560px){.wo-c .muted{min-width:0}.wo-facts div{padding:8px 10px}}

/* v9 */
.has-fb .fb{display:inline-flex}
.seg.role .vas{font-size:11px;font-weight:700;color:var(--faint);padding:0 6px 0 4px;align-self:center;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.savest{font-size:12px;color:var(--faint);white-space:nowrap}
.savest.good{color:var(--good)}.savest.warn{color:var(--warn)}
.savest.good::before{content:"✓ "}
.fbctx{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);border-left:3px solid var(--tape)}
.tbanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:min(720px,calc(100% - 32px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 16px 40px -12px rgba(0,0,0,.35)}
.tbanner .small{color:var(--soft);margin-top:2px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.ubar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.ubar i{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.ubar em{display:block;height:100%;background:var(--tape);border-radius:4px}
.ubar b{text-align:right;font-size:12.5px}
.lrow.fbdone{opacity:.55}
.wsdata .in.sm{width:auto}
@media(max-width:720px){.ugrid{grid-template-columns:1fr}.ubar{grid-template-columns:110px 1fr 56px}}

#who{display:none}

function hard(job,cid){const c=crewById(cid);const out=[];
 if(c.f.status!=='active'){out.push('Inactive');return out;}

 const r=c.r[job.type];if(r==null){if(!S.rules.untested)out.push(`Not rated for ${dimL(job.type).toLowerCase()} yet`);}else if(r<S.rules.minType)out.push(`Rated ${r} for ${dimL(job.type).toLowerCase()}, minimum is ${S.rules.minType}`);
 if(S.rules.lead&&job.built<1978&&leadTracked()){if(c.f.leadSafe!==true)out.push(`No lead-safe certification on file (home built ${job.built})`);}
 if(S.rules.imp&&imp(job)){const q=c.r.quality,cf=c.r.client;if(q==null||cf==null||q<S.rules.impBar||cf<S.rules.impBar)out.push(`Important client: needs quality and client-facing ${S.rules.impBar}+`);}

 const dm=driveMin(c.f.base,job.area);if(dm!=null&&dm>S.rules.maxDrive&&!(S.rules.region&&c.f.region!==job.region))out.push(`${dm} min away, limit is ${S.rules.maxDrive}`);

function factors(job,cid,slot,B){const c=crewById(cid);const f={};const h=hist(cid);

 const sk=job.skills.map(k=>c.r[k]).filter(v=>v!=null);f.skills=sk.length?Math.round(sk.reduce((a,b)=>a+b,0)/sk.length*20):60;

const XLSX_JS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const MAPOPTS=[['ignore','Ignore'],['name','Crew name'],['sfName','Salesforce name'],['email','Email'],['phone','Phone'],['gcal','Calendar name'],['status','Status'],['size','Crew size'],['base','Home base'],['notes','Notes'],['r-job','Rating: job type'],['r-skill','Rating: skill'],['r-attr','Rating: attribute'],['info','Other info']];
const ALIAS=[[/interior/i,'interior'],[/exterior/i,'exterior'],[/cabinet/i,'cabinets'],[/commercial|hoa/i,'commercial'],[/wallpaper/i,'wallpaper'],[/decorat/i,'decorative'],[/drywall|skim/i,'drywall'],[/prep/i,'prep'],[/cut/i,'cutin'],[/spray/i,'spray'],[/color|detail/i,'color'],[/speed/i,'speed'],[/reliab/i,'reliability'],[/quality/i,'quality'],[/communic/i,'communication'],[/care|jobsite/i,'care'],[/independ/i,'independence'],[/client/i,'client']];
const dimKey=l=>{const a=ALIAS.find(([re])=>re.test(l));return a?a[1]:slug(l);};
async function readSheet(file){await loadScript(XLSX_JS);const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sheets=[];
 wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});let h=-1;
  let best=0;for(let i=0;i<Math.min(8,rows.length);i++){const r=rows[i]||[];const strs=r.filter(v=>typeof v==='string'&&v.trim()).length;if(strs>=3&&strs>best&&r.some(v=>typeof v==='string'&&/^(crew|name)$/i.test(v.trim()))){h=i;best=strs;}}
  if(h<0)return;const head=rows[h];const gr=h>0?rows[h-1]:[];let g=null;const groups=head.map((_,j)=>{if(gr&&typeof gr[j]==='string'&&gr[j].trim())g=gr[j].trim();return g;});
  const data=rows.slice(h+1).filter(r=>r&&r[head.findIndex(v=>typeof v==='string'&&/^(crew|name)$/i.test(v.trim()))]);sheets.push({name:n,h,head,groups,rows:data});});
 if(!sheets.length)throw new Error('nohead');
 const cols=[];sheets.forEach(s=>s.head.forEach((hd,j)=>{if(hd==null||String(hd).trim()==='')return;const head=String(hd).trim();const grp=s.groups[j]||'';const vals=s.rows.map(r=>r[j]).filter(v=>v!=null&&v!=='');const ex=vals[0] instanceof Date?'(date) '+vals[0].toISOString().slice(5,10):String(vals[0]??'').slice(0,24);
  let as='info';const num=vals.length&&vals.every(v=>typeof v==='number'&&v>=0&&v<=5);
  if(/^(crew|name)$/i.test(head))as='name';else if(/salesforce/i.test(head))as='sfName';else if(/e-?mail/i.test(head))as='email';else if(/phone/i.test(head))as='phone';else if(/calendar/i.test(head))as='gcal';else if(/status/i.test(head))as='status';else if(/size/i.test(head))as='size';else if(/base|location|city|area/i.test(head))as='base';else if(/note/i.test(head))as='notes';
  else if(/job/i.test(grp))as='r-job';else if(/skill/i.test(grp))as='r-skill';else if(/attrib/i.test(grp)||num)as='r-attr';
  if(as.startsWith('r-')){const kd=DIMS.find(d=>d.k===dimKey(head));if(kd)as='r-'+kd.g;}
  cols.push({sheet:s.name,j,head,group:grp,ex,as});}));
 const names=[...new Set(sheets.flatMap(s=>{const ni=s.head.findIndex(v=>typeof v==='string'&&/^(crew|name)$/i.test(v.trim()));return s.rows.map(r=>String(r[ni]).trim());}))];
 return{type:'mapping',file:file.name,sheets,cols,names};}
function sizeFrom(v){if(v instanceof Date)return{s:parseSize(`${v.getMonth()+1}-${v.getDate()}`),fixed:true};if(typeof v==='number'&&v>1000){const d=new Date(Math.round((v-25569)*864e5));return{s:parseSize(`${d.getUTCMonth()+1}-${d.getUTCDate()}`),fixed:true};}return{s:parseSize(v),fixed:false};}
function applyImport(m){const byName={};const fixed=[];const dims=[];
 m.cols.filter(c=>c.as.startsWith('r-')).forEach(c=>{const k=dimKey(c.head);if(!dims.some(d=>d.k===k))dims.push({k,l:c.head,g:c.as.slice(2)});});
 m.names.forEach(n=>byName[n]={name:n,f:{status:'',size:null,base:'',notes:'',sfName:'',gcal:'',email:'',phone:''},r:{}});
 m.sheets.forEach(s=>{const ni=s.head.findIndex(v=>typeof v==='string'&&/^(crew|name)$/i.test(v.trim()));s.rows.forEach(r=>{const cr=byName[String(r[ni]).trim()];
  m.cols.filter(c=>c.sheet===s.name&&c.as!=='ignore'&&c.as!=='name').forEach(c=>{const v=r[c.j];if(v==null||v==='')return;
   if(c.as==='size'){const z=sizeFrom(v);cr.f.size=z.s;if(z.fixed){cr.f.sizeFixed=true;fixed.push(cr.name);}}
   else if(c.as.startsWith('r-')){const n=+v;if(!isNaN(n))cr.r[dimKey(c.head)]=n;}
   else if(c.as==='status')cr.f.status=/inact|no|off/i.test(v)?'inactive':'active';
   else if(c.as==='info'){cr.f[slug(c.head)]=String(v);}else cr.f[c.as]=c.as==='email'||c.as==='phone'?'on file':String(v);});});});
 const old=Object.fromEntries(CREWS.map(c=>[c.name,c]));const blankStatus=Object.values(byName).filter(c=>!c.f.status).length;
 DIMS=dims.length?dims:DIMS;
 CREWS=Object.values(byName).map((c,i)=>{const o=old[c.name];const r={};DIMS.forEach(d=>r[d.k]=c.r[d.k]??null);
  return{id:o?o.id:slug(c.name),name:c.name,c:o?o.c:COLORS[i%COLORS.length],r,f:{...c.f,status:c.f.status||(/test/i.test(c.name)?'inactive':'active'),base:c.f.base||(o?o.f.base:''),baseSample:!c.f.base&&o?o.f.baseSample:false,languages:o?o.f.languages:'',leadSafe:o?o.f.leadSafe:undefined}};});
 const rated=CREWS.filter(c=>dimsOf('job').some(d=>c.r[d.k]!=null)).length;
 S.imp={file:m.file,when:stamp()+' by '+ME().split(' (')[0],rows:CREWS.length,sheets:m.sheets.map(s=>s.name),findings:[
  ['ok',`Merged ${plural(m.sheets.length,'sheet')} on crew name: ${plural(CREWS.length,'crew')}.`],
  ['ok',`Found ${plural(DIMS.length,'rating column')}: ${dimsOf('job').length} job types, ${dimsOf('skill').length} skills, ${dimsOf('attr').length} attributes. Crew Board now ranks on these.`],
  ...(fixed.length?[['wn',`${plural(fixed.length,'crew size')} had been turned into dates by Excel. Fixed and shown as ranges. Please confirm.`]]:[]),
  ...(blankStatus?[['wn',`Status was blank for ${plural(blankStatus,'crew')}. Set to active (test rows inactive).`]]:[]),
  ['wn',`${rated} of ${CREWS.length} crews have job-type ratings. The rest can’t be matched until rated.`]]};
 log('Crew data',`Imported ${m.file}: ${plural(CREWS.length,'crew')}, ${plural(DIMS.length,'rating column')}.${fixed.length?` Fixed ${fixed.length} crew sizes Excel had turned into dates.`:''}`);}

 if(a==='fb8pin'){S.modal=null;drawLayer();const el=document.querySelector('#app .pgw')||document.getElementById('app');if(COMMENTS)COMMENTS.openComposer({element:el}).catch(()=>{});}
 if(a==='tconsent'){T.on=v8yes(b.dataset.v==='1');}
 if(a==='uref'){loadUsage();}
 if(a==='ufilter'){S.uMine=!S.uMine;render();}
 if(a==='fbdone'){markFb(b.dataset.u,b.dataset.v,b.dataset.s);}
 if(a==='wsexport'){exportWs();}
 if(a==='wsreset'){S.modal={type:'wsreset'};drawLayer();}
 if(a==='wsresetok'){resetWs();}
 if(a==='madd'){const n=(document.getElementById('mname')||{}).value||'';const r=(document.getElementById('mrole')||{}).value||'scheduler';if(!n.trim()){toast('Add a name');return;}WS.members.push({id:'m_'+Date.now().toString(36),name:n.trim(),role:r});log('Setting',`Added workspace member ${n.trim()} (${roleL(r)}).`);drawMemberSwitch();render();}
 if(a==='mrm'){const m=memberById(b.dataset.v);if(WS.members.length<2||m.id===S.member){toast('You can’t remove the member you’re viewing as');return;}WS.members=WS.members.filter(x=>x.id!==m.id);log('Setting',`Removed workspace member ${m.name}.`);drawMemberSwitch();render();}
 if(a==='mrole'){const m=memberById(b.dataset.v);m.role=m.role==='admin'?'scheduler':'admin';if(m.id===S.member)useMember(m.id);drawMemberSwitch();render();}
},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.mname){const m=memberById(t.dataset.mname);m.name=t.value.trim()||m.name;if(m.id===S.member)useMember(m.id);drawMemberSwitch();render();}if(t.id==='wsimport'&&t.files&&t.files[0])importWs(t.files[0]);});
/* consent banner (per person, remembered privately) */
function v8yes(on){T.on=on;S.tAsked=true;const el=document.getElementById('tbanner');if(el)el.remove();try{localStorage.setItem('cb-telemetry',on?'1':'0');}catch(_){}if(DB&&UID)DB.doc('data/users/'+UID+'/prefs').set({telemetry:on,at:Date.now()}).catch(()=>{});toast(on?'Thanks. Usage sharing is on':'Usage sharing is off');if(on){T.dirty=true;flushT();}return on;}
function showConsent(){if(document.getElementById('tbanner'))return;const d=document.createElement('div');d.id='tbanner';d.className='tbanner';
 d.innerHTML=`<div class="grow"><b>Help us improve Crew Board</b><div class="small">Share which pages and features you use and how long you spend on each. No client names, phone numbers or prices are sent. You can change this in Setup.</div></div><button class="btn sm tape" data-act="tconsent" data-v="1">Share usage</button><button class="btn sm line" data-act="tconsent" data-v="0">No thanks</button>`;document.body.appendChild(d);}
/* ---------- export / import / reset ---------- */
function wsBundle(){const o={app:'crewboard',v:1,exported:new Date().toISOString(),parts:{}};Object.keys(PARTS).forEach(k=>o.parts[k]=JSON.parse(partJSON(k)));return o;}
async function exportWs(){const data=JSON.stringify(wsBundle(),null,1);const fn=`crewboard-${(WS.name||'workspace').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`;
 try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data});return;}}catch(_){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click();}catch(_){toast('Download isn’t available here');}}
function importWs(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='crewboard'||!o.parts)throw 0;Object.keys(PARTS).forEach(k=>applyPart(k,o.parts[k]));useMember(S.member);log('Setting','Imported workspace data from a backup file.');drawMemberSwitch();render();scheduleSave();toast('Backup loaded');}catch(_){toast('That file isn’t a Crew Board backup');}};r.readAsText(file);}
M.wsreset=()=>MW('Reset workspace',`<div class="eyebrow">Workspace data</div><h2 class="mt">Go back to the sample data?</h2><p class="small muted">This deletes the saved crews, jobs, calendar and settings for everyone in this workspace. Usage data and feedback are kept. Export a backup first if you might want it back.</p>
 <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn line" data-act="wsexport">Export a backup</button><button class="btn" style="background:var(--bad);color:#fff" data-act="wsresetok">Delete saved data</button><button class="btn line" data-act="closemodal2">Cancel</button></div>`);
async function resetWs(){if(!DB)return;try{for(const k of Object.keys(PARTS))await DB.doc('ws/'+k).delete();await DB.doc('ws/meta').delete();}catch(_){toast('Couldn’t reset. Try again');return;}SAVE.loaded=false;toast('Saved data deleted. Reloading sample data');setTimeout(()=>location.reload(),600);}
/* ---------- Setup: members + workspace data ---------- */
V.setup=(()=>{const old=V.setup;return(...a)=>{let h=old(...a);if(!isAdmin())return h;
 const card=`<section class="card pad wide2 wsdata"><div class="row" style="flex-wrap:wrap"><h3 class="grow">Workspace and members</h3><span id="savest2" class="savest ${SAVE.state==='saved'?'good':''}">${DB?(SAVE.ro?'View only':SAVE.state==='saved'?'Saved':'Sample data until the first change'):'Not saved in this view'}</span></div>
  <p class="small muted" style="margin:6px 0 10px">Everyone in ${esc(WS.name)} works off the same saved crews, jobs, calendar and settings. Members are the people Crew Board schedules as. Use “Viewing as” at the top to see the app the way each one does.</p>
  ${WS.members.map(m=>`<div class="hr"><input class="in sm" data-mname="${m.id}" value="${esc(m.name)}" aria-label="Member name" style="max-width:200px"><button class="pill ${m.role==='admin'?'on':''}" data-act="mrole" data-v="${m.id}">${roleL(m.role)}</button><span class="grow tiny">${m.role==='admin'?'Setup, audit log, labels, crew data':'Schedules jobs, picks from admin labels'}</span>${S.member===m.id?'<span class="chip tape">Viewing as</span>':`<button class="x0" data-act="mrm" data-v="${m.id}" aria-label="Remove ${esc(m.name)}">×</button>`}</div>`).join('')}
  <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px"><input class="in sm" id="mname" placeholder="Name" style="max-width:200px" aria-label="New member name"><select class="in sm" id="mrole" style="width:auto" aria-label="Role"><option value="scheduler">Scheduler</option><option value="admin">Admin</option></select><button class="btn sm line" data-act="madd">+ Add member</button></div>
  <div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px"><button class="btn sm line" data-act="wsexport">Export a backup (JSON)</button><label class="btn sm line" for="wsimport">Load a backup</label><input type="file" id="wsimport" accept=".json,application/json" hidden><button class="btn sm line" data-act="wsreset">Reset to sample data</button>
   <span class="grow"></span><span class="tiny">Usage sharing: <b>${T.on?'on':'off'}</b> <button class="lnk" data-act="tconsent" data-v="${T.on?'0':'1'}" style="font-size:12px">${T.on?'Turn off':'Turn on'}</button></span></div></section>`;
 const i=h.indexOf('<div class="setgrid">');return i<0?h+card:h.slice(0,i+'<div class="setgrid">'.length)+card+h.slice(i+'<div class="setgrid">'.length);};})();
Object.keys(V).forEach(k=>{const f=V[k];if(typeof f!=='function'||f.__w)return;const g=(...a)=>`<div id="pg-${k}" class="pgw">${f(...a)}</div>`;g.__w=1;V[k]=g;});
/* ---------- Usage (owner only) ---------- */
S.uMine=true;S.usage=null;
const fmtMin=ms=>{const m=Math.round(ms/60000);return m<1?'<1 min':m<60?m+' min':`${Math.floor(m/60)} h ${m%60} min`;};
const fmtD=ts=>new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
async function loadUsage(){if(!DB||!OWNER)return;S.usage={loading:true};render();
 try{const[t,f]=await Promise.all([DB.collection('telemetry').get(),DB.collection('feedback').get()]);
  const sessions=[];t.docs.forEach(d=>{const x=d.data()||{};Object.entries(x.sessions||{}).forEach(([sid,s])=>sessions.push({uid:d.id,sid,...s}));});
  const fb=[];f.docs.forEach(d=>{const x=d.data()||{};Object.entries(x.items||{}).forEach(([id,it])=>fb.push({uid:d.id,id,...it}));});
  sessions.sort((a,b)=>b.end-a.end);fb.sort((a,b)=>b.ts-a.ts);S.usage={sessions,fb,at:Date.now()};}catch(e){S.usage={err:true};}render();}
async function markFb(uid,id,st){if(!DB)return;try{await DB.doc('feedback/'+uid).update({items:{[id]:{status:st}}});const it=S.usage.fb.find(x=>x.uid===uid&&x.id===id);if(it)it.status=st;render();}catch(_){toast('Couldn’t update');}}
V.usage=()=>{if(!OWNER)return '<div class="card pad">Only the owner sees usage.</div>';const U=S.usage;
 if(!U||U.loading)return `<div class="qhead"><div class="grow"><div class="eyebrow">Owner only</div><h1>Usage and feedback</h1></div></div><div class="card pad muted">Loading…</div>`;
 if(U.err)return `<div class="qhead"><div class="grow"><h1>Usage and feedback</h1></div><button class="btn line" data-act="uref">Try again</button></div><div class="card pad">Couldn’t load usage data.</div>`;
 const ss=U.sessions.filter(s=>!S.uMine||!s.owner);const tot={};const fe={};let time=0;const va={};
 ss.forEach(s=>{Object.entries(s.pages||{}).forEach(([p,ms])=>{tot[p]=(tot[p]||0)+ms;time+=ms;});Object.entries(s.feats||{}).forEach(([a,n])=>{if(!a.startsWith('go:')&&!FEAT_SKIP.has(a))fe[a]=(fe[a]||0)+n;});Object.entries(s.viewAs||{}).forEach(([r,ms])=>va[r]=(va[r]||0)+ms);});
 const pages=Object.entries(tot).sort((a,b)=>b[1]-a[1]);const mx=pages[0]?pages[0][1]:1;const feats=Object.entries(fe).sort((a,b)=>b[1]-a[1]).slice(0,15);const fmx=feats[0]?feats[0][1]:1;
 const fb=U.fb.filter(x=>!S.uMine||!x.owner);const people=new Set(ss.map(s=>s.uid)).size;
 const kindL={idea:'Idea',bug:'Broken',confusing:'Confusing',love:'Love'};
 return `<div class="qhead"><div class="grow"><div class="eyebrow">Owner only · Ido doesn’t see this tab</div><h1>Usage and feedback</h1><p class="small muted" style="margin:4px 0 0">Updated ${fmtD(U.at)}. Sessions report every 20 seconds while Crew Board is open.</p></div>
  <button class="btn line" data-act="ufilter">${S.uMine?'Include my own sessions':'Hide my own sessions'}</button><button class="btn line" data-act="uref">Refresh</button></div>
 <div class="kstrip"><div><b class="num">${ss.length}</b><span>sessions</span><small>${plural(people,'person','people')}</small></div><div><b class="num">${fmtMin(time)}</b><span>time in Crew Board</span><small>${ss[0]?'last active '+fmtD(ss[0].end):'no activity yet'}</small></div><div><b class="num">${fmtMin(va.admin||0)} / ${fmtMin(va.scheduler||0)}</b><span>admin view / scheduler view</span><small>time viewing as each</small></div><div><b class="num">${fb.length}</b><span>feedback notes</span><small>${fb.filter(x=>x.status!=='done').length} open</small></div></div>
 <div class="split2 ugrid"><section class="card pad"><h3 style="font-size:17px">Time by page</h3>${pages.map(([p,ms])=>`<div class="ubar"><span>${esc(PAGEN[p]||p)}</span><i><em style="width:${Math.max(3,ms/mx*100)}%"></em></i><b class="num">${fmtMin(ms)}</b></div>`).join('')||'<p class="small muted">No sessions yet.</p>'}</section>
 <section class="card pad"><h3 style="font-size:17px">Features used</h3>${feats.map(([a,n])=>`<div class="ubar"><span>${esc(FEATN[a]||a)}</span><i><em style="width:${Math.max(3,n/fmx*100)}%;background:var(--good)"></em></i><b class="num">${n}</b></div>`).join('')||'<p class="small muted">Nothing used yet.</p>'}</section></div>
 <section class="card" style="margin-top:14px"><div class="pad" style="padding-bottom:4px"><h3 style="font-size:17px">Feedback, with the page it was left on</h3></div>${fb.map(x=>`<div class="lrow ${x.status==='done'?'fbdone':''}"><span class="chip ${x.kind==='bug'?'bad':x.kind==='love'?'good':x.kind==='confusing'?'warn':'tape'}">${kindL[x.kind]||'Note'}</span><div class="grow" style="min-width:0"><div><b>${esc(ctxLine(x))}</b>${x.section?` <span class="tiny">· ${esc(x.section)}</span>`:''}</div><div class="small" style="margin-top:3px;white-space:pre-line">${esc(x.text)}</div><div class="tiny" style="margin-top:3px">${fmtD(x.ts)} · viewing as ${esc((WS.members.find(m=>m.id===x.viewAs)||{}).name||x.viewAs)}, ${roleL(x.role)}</div></div><button class="btn sm line" data-act="fbdone" data-u="${x.uid}" data-v="${x.id}" data-s="${x.status==='done'?'new':'done'}">${x.status==='done'?'Reopen':'Done'}</button></div>`).join('')||'<p class="pad small muted">No feedback yet.</p>'}</section>
 <section class="card pad" style="margin-top:14px"><h3 style="font-size:17px">Recent sessions</h3>${ss.slice(0,20).map(s=>{const top=Object.entries(s.pages||{}).sort((a,b)=>b[1]-a[1])[0];const dur=Object.values(s.pages||{}).reduce((a,b)=>a+b,0);return `<div class="hr"><span class="grow small">${fmtD(s.start)}${s.owner?' <span class="chip">you</span>':''}</span><span class="small muted">${top?'mostly '+esc(PAGEN[top[0]]||top[0]):''}</span><b class="num small" style="min-width:70px;text-align:right">${fmtMin(dur)}</b></div>`;}).join('')||'<p class="small muted">No sessions yet.</p>'}</section>`;};
V.usage.__w=0;{const f=V.usage;const g=(...a)=>`<div id="pg-usage" class="pgw">${f(...a)}</div>`;g.__w=1;V.usage=g;}
PAGEN.usage='Usage';
/* ---------- render hook: tabs, page timer, save status ---------- */
const _render9=render;render=function(){_render9();drawMemberSwitch();
 if(OWNER&&isAdmin()){const tb=document.getElementById('tabs');if(tb&&!tb.querySelector('[data-go=usage]')){const b=document.createElement('button');b.dataset.go='usage';b.textContent='Usage';if(S.view==='usage')b.setAttribute('aria-current','page');tb.appendChild(b);}}
 T.page(S.view);
 if(!document.getElementById('savest')){const w=document.getElementById('who');if(w){const s=document.createElement('span');s.id='savest';s.className='savest';w.after(s);}}markSave(SAVE.state);};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go=usage]');if(g){S.view='usage';loadUsage();}},true);
/* ---------- start ---------- */
(async()=>{try{if(!window.claude||!window.claude.use)return;
 const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);DB=db;USER=user;
 if(USER){UID=await USER.id();OWNER=await USER.isOwner();CANW=await USER.can('data.write');}
 if(CANW===false)SAVE.ro=true;
 if(DB){await loadWorkspace();watchWorkspace();
  let anon=null;try{anon=localStorage.getItem('cb-anon');if(!anon){anon='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('cb-anon',anon);}}catch(_){}
  WKEY=UID||anon||SID;document.documentElement.classList.add('has-fb');
  let pref=null;if(UID){try{const p=await DB.doc('data/users/'+UID+'/prefs').get();if(p.exists)pref=p.data();}catch(_){}}
  if(!pref){try{const l=localStorage.getItem('cb-telemetry');if(l)pref={telemetry:l==='1'};}catch(_){}}
  if(pref&&typeof pref.telemetry==='boolean')T.on=pref.telemetry;else if(OWNER)T.on=true;else showConsent();}
 else markSave('local');
 render();}catch(_){markSave('local');}})();
render();
